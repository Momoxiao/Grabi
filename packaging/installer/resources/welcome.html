<body>
    <h2>安装 Grabi</h2>
    <p>Grabi 是一个原生 macOS 菜单栏截图工具，支持窗口、区域和全屏截图、就地标注与离线文字识别。</p>
    <p>安装器会把 <strong>Grabi.app</strong> 放到 <code>/Applications</code>，并在安装前退出正在运行的旧实例。</p>
    <p class="muted">安装完成后首次启动时，请按系统提示授予“屏幕录制”权限。</p>
